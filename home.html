<html lang="en">

<body>
    <div id="menu-container"></div>
  
<!-- =========================================
     BANNER 3 SLIDES
========================================= -->

<section class="banner">

    <!-- สไลด์ที่ 1 -->
    <div class="slide active">

        <div class="slide-content">

            <p class="small-title">
                date 9/27-10/1-2026
            </p>

            <h1>
                PAYDAY ลดสูงสุด 50%<br>
                
            </h1>

            <p class="description">
              + ลดเพิ่มสูงสุด 35% เมื่อช้อปครบ ฿2,500
            </p>

            <a href="shop.html" class="banner-button">
                Buy now
            </a>

        </div>

    </div>


    <!-- สไลด์ที่ 2 -->
    <div class="slide">

        <div class="slide-content">

            <p class="small-title">
                date 9/27-10/1-2026
            </p>

            <h1>
                ทุกรีวิว<br>
               รับฟรีของแถมสุด cute
            </h1>

            <p class="description">
                รีบเลยของแถมมีจำนวนจำจัด!!
            </p>

            <a href="Review.html" class="banner-button">
                Review now
            </a>

        </div>

    </div>


    <!-- สไลด์ที่ 3 -->
    <div class="slide">

        <div class="slide-content">

            <p class="small-title">
                date 9/27-10/1-2026
            </p>

            <h1>
               Graviity fall<br>
                x<br>
                Sanrio
            </h1>

            <p class="description">
               คอลแลปส์สุดคิวท์กำลังมาแล้ว
            </p>

            <a href="shop.html" class="banner-button">
                Buy now
            </a>

        </div>

    </div>


    <!-- ปุ่มเลื่อนซ้าย -->
    <button class="prev" onclick="changeSlide(-1)">
        &#10094;
    </button>


    <!-- ปุ่มเลื่อนขวา -->
    <button class="next" onclick="changeSlide(1)">
        &#10095;
    </button>


    <!-- จุดบอกจำนวนสไลด์ -->

    <div class="dots">

        <span class="dot active"
              onclick="currentSlide(0)">
        </span>

        <span class="dot"
              onclick="currentSlide(1)">
        </span>

        <span class="dot"
              onclick="currentSlide(2)">
        </span>

    </div>

</section>

<div id="footer"></div>
</body>
